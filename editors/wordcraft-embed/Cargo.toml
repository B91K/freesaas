# WordCraft built for embedding in the FreeSaaS hub.
#
# Same app as upstream `wordcraft-web`, with a different shell: documents
# are opened and saved through the hub (window.postMessage) instead of the
# browser's file picker and downloads. Uses the upstream crates unchanged.
#
# Its own workspace so it resolves exactly the dependency versions upstream
# tests with: Cargo.lock starts as a copy of upstream/wordcraft/Cargo.lock.
[workspace]

[package]
name = "wordcraft-embed"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license-file = "../../LICENSE"
publish = false

[dependencies]
wordcraft-engine = { path = "../../upstream/wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../../upstream/wordcraft/crates/ui-egui" }
wordcraft-fonts = { path = "../../upstream/wordcraft/crates/fonts" }
egui = "0.36"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.17"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "MessageEvent", "DomStringList", "MediaQueryList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
