# Builds the hub and the three editors into a static site and publishes it
# on GitHub Pages. Pages serves static files only: nothing here is secret.
# Settings → Pages → Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.21.14

jobs:
  editor:
    name: Build ${{ matrix.editor }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - editor: wordcraft
            workspace: editors/wordcraft-embed
          - editor: gridcraft
            workspace: upstream/gridcraft
          - editor: deckcraft
            workspace: upstream/deckcraft
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.editor }}
          # Both workspaces sit two levels down, so the build dir is ../../target/web/<editor>.
          workspaces: ${{ matrix.workspace }} -> ../../target/web/${{ matrix.editor }}
      - name: Install trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin
      - run: scripts/build-web.sh dist/site ${{ matrix.editor }}
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.editor }}
          path: dist/site
          retention-days: 3

  deploy:
    needs: editor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          merge-multiple: true
          path: dist/site
      # Public settings for the hub, from the repository *variable*
      # FREESAAS_PUBLIC_CONFIG (Settings → Secrets and variables → Actions →
      # Variables). It is served to every visitor, so it holds only public
      # values such as OAuth client ids, never secrets.
      - run: scripts/build-web.sh dist/site hub
        env:
          FREESAAS_PUBLIC_CONFIG: ${{ vars.FREESAAS_PUBLIC_CONFIG || '{"mode":"static"}' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
